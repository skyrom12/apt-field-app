<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APT Field App</title>
<meta name="theme-color" content="#0C1A35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--brand:#B22234;--navy:#0C1A35;--ink:#0C1A35;--muted:#5A6578;--line:#DFE2E8;--bg:#FAFBF6;--ok:#2e7d32;--warn:#b26a00;--err:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--brand);position:sticky;top:0;z-index:5}
  header h1{font-size:1.05rem;margin:0}
  header .sub{font-size:.8rem;opacity:.8}
  select,input,textarea,button{font:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:12px}
  .pickers{display:flex;gap:8px;margin-bottom:12px}
  .pickers select{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .stop{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
  .stop .num{font-weight:700;color:var(--brand);min-width:1.6em;font-size:1.1rem}
  .stop .who{font-weight:600}
  .stop .addr{color:var(--muted);font-size:.86rem}
  .stop .done{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ok)}
  .stop .skip{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--warn)}
  .stop a{margin-left:auto;color:var(--brand);text-decoration:none;font-size:.82rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
  .card h2{margin:0 0 2px;font-size:1.1rem}
  .card .addr{color:var(--muted);margin-bottom:12px}
  .sect{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);border-top:1px solid var(--line);padding-top:14px;margin:16px 0 8px}
  .svc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 6px}
  .svc label{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:.92rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
  .field input,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
  textarea{min-height:64px;resize:vertical}
  /* segmented buttons */
  .segrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .segrow .sl{font-size:.9rem;font-weight:600}
  .seg{display:flex;gap:4px}
  .seg button{min-width:40px;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  /* chemical steppers */
  .chem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .chem:last-child{border-bottom:0}
  .chem .cl{flex:1;min-width:0}
  .chem .cl b{display:block;font-size:.92rem}
  .chem .cl span{font-size:.78rem;color:var(--muted)}
  .chem .qtybox{display:flex;align-items:center;gap:4px}
  .chem .qtybox button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:1.2rem;font-weight:700;cursor:pointer;color:var(--navy)}
  .chem .qty{width:56px;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:8px}
  .chem .lineamt{min-width:60px;text-align:right;font-weight:700;font-size:.9rem;color:var(--muted)}
  .chem .lineamt.nz{color:var(--ink)}
  .morechems{width:100%;padding:10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font-weight:600;cursor:pointer;margin-top:6px}
  .totalbar{position:sticky;bottom:0;background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-weight:700}
  .totalbar small{font-weight:400;opacity:.8;display:block;font-size:.75rem}
  .custchem{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.92rem;margin-top:10px}
  .btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;color:var(--warn);border:1px solid var(--line);margin-top:8px}
  .btn.back{background:#fff;color:var(--muted);border:1px solid var(--line);margin-bottom:10px;width:auto;padding:8px 14px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .spinner{text-align:center;color:var(--muted);padding:30px 0}
  /* office */
  .qb{display:flex;align-items:center;gap:10px;font-size:.9rem}
  .dot{width:10px;height:10px;border-radius:99px;background:var(--err)}
  .dot.on{background:var(--ok)}
  .meta{color:var(--muted);font-size:.86rem;margin:2px 0 8px}
  .kv{margin:2px 0;font-size:.92rem}
  .kv b{color:var(--muted);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{font-size:.78rem;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px}
  .bill{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .bill b{font-size:1.05rem}
  .bill .warn{color:var(--warn);font-size:.8rem}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .actions button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;width:auto}
  .actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .actions button.danger{color:var(--err)}
  .err{color:var(--err);font-size:.86rem;margin-top:6px}
  .badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  /* .warn was used by the billing line but never defined — it rendered as plain text */
  .warn{color:var(--warn);font-weight:600}
  /* arrival bar */
  .arrive{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .arrive.on{background:#e8f5e9;border-color:#a5d6a7}
  .arrive button{flex:1;padding:14px;border:0;border-radius:10px;font-weight:700;font-size:1.02rem;background:var(--navy);color:#fff;cursor:pointer}
  .arrive .at{font-weight:700}
  .arrive .sub2{font-size:.8rem;color:var(--muted)}
  .arrive .gps{font-size:.78rem;color:var(--muted);margin-top:2px}
  .arrive .gps.bad{color:var(--warn)}

  /* add-customer form */
  .addhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .addhead h2{margin:0;font-size:1rem}
  .addhead button{width:auto;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600;cursor:pointer}
  .field .hint{font-weight:400;text-transform:none}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.f2{grid-template-columns:1fr}}
  .slot{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
  .slot.on{border-color:var(--brand)}
  .slot input{margin-top:4px;width:18px;height:18px}
  .slot .who{font-weight:700}
  .slot .why{color:var(--muted);font-size:.86rem;margin-top:2px}
  .slot .mi{margin-left:auto;font-weight:700;white-space:nowrap}
  .matched{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
  .note{color:var(--muted);font-size:.84rem;margin-top:8px}
  /* customers panel */
  .cu-search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:12px 0 8px}
  .cu-count{color:var(--muted);font-size:.84rem;margin-bottom:8px}
  .cu{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
  .cu-head{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
  .cu-head .nm{font-weight:700}
  .cu-head .ad{color:var(--muted);font-size:.84rem}
  .cu-head .rt{margin-left:auto;font-weight:700;white-space:nowrap}
  .cu-head .rt.none{color:var(--warn);font-weight:600;font-size:.84rem}
  .cu-days{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .cu-days .chip{font-size:.74rem;padding:2px 8px}
  .cu.inactive .cu-head{opacity:.55}
  .cu-body{border-top:1px solid var(--line);padding:12px}
  .cu-body .actions{margin-top:8px}
  .cu-flag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff3e0;color:var(--warn);border:1px solid #f3d9a4}
  .cu-orph{background:#fff3e0;border:1px solid #f3d9a4;border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:12px}
</style>
</head>
<body>
<header><div><h1 id="title">APT Field App</h1><div class="sub">American Pool Techs</div></div><div id="hdr"></div></header>
<div class="wrap" id="addwrap"></div>
<div class="wrap" id="app"><div class="spinner">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxCS8NbiIQIYNm4YBhIHMmuhn8jt0LMEKYJnx8sEU2IA8Q1-FeZ3GzVTpCb1kN1LQFIiQ/exec';
const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
const TECHS = ['Adam','Bradley','Nick','Zack'];
const SERVICES = ['Skimmed surface','Brushed walls & steps','Vacuumed pool','Emptied baskets',
                  'Tested water','Balanced chemicals','Backwashed filter','Cleaned filter',
                  'Checked equipment'];
// Chemicals shown up front (the paper form's right-hand column); the rest sit
// behind "More chemicals". Keys must match the Prices tab in APT Field Ops.
const COMMON_CHEMS = ['tabs','shock_lb','acid_gal','alk_lb','stab_lb','ch_lb','salt_bag'];
const READING_FIELDS = [
  ['ch','Calcium ppm'],['tc','Total Cl ppm'],['fc','Free Cl ppm'],['ph','pH'],
  ['alk','Alkalinity'],['cya','Stabilizer'],['salt','Salt'],['phos','Phosphates']
];
const IS_OFFICE = new URLSearchParams(location.search).get('view') === 'office';

function readStore(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function writeStore(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function $(id){ return document.getElementById(id); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2); }

async function api(action, params){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, params))
  });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error || 'Request failed');
  return out.data;
}

/* ---------------- TECH VIEW ---------------- */
let state = { tech: readStore('apt.tech'), day: defaultDay(), route: [], stop: null, photos: [],
              prices: [], timeIn: null, arrival: null, timer: null };

/** Phone GPS, best effort. Never blocks the visit: if the tech denies the
 *  prompt or there is no fix in 12s we carry on with the time only. */
function getFix(){
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    let done = false;
    const finish = v => { if (!done){ done = true; resolve(v); } };
    setTimeout(() => finish(null), 12000);
    navigator.geolocation.getCurrentPosition(
      p => finish({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6),
                    accuracy: Math.round(p.coords.accuracy) }),
      () => finish(null),
      { enableHighAccuracy: true, timeout: 11000, maximumAge: 0 });
  });
}

function clockTime(iso){
  try { return new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
  catch(e){ return ''; }
}

/** The tech taps "I'm here" on arrival: stamps the time and grabs a GPS fix. */
async function markArrived(){
  const btn = document.querySelector('.arrive button');
  if (btn){ btn.disabled = true; btn.textContent = 'Getting location\u2026'; }
  const at = new Date().toISOString();
  const fix = await getFix();
  state.arrival = Object.assign({ at: at }, fix || { lat: null, lng: null, accuracy: null });
  state.timeIn = at;
  renderArrival();
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(renderArrival, 30000);
}

function renderArrival(){
  const el = $('arriveBar');
  if (!el) return;
  const a = state.arrival;
  if (!a){
    el.className = 'arrive';
    el.innerHTML = '<button onclick="markArrived()">I\u2019m here \u2014 start visit</button>';
    return;
  }
  const mins = Math.max(0, Math.round((Date.now() - new Date(a.at)) / 60000));
  const gps = (a.lat != null)
    ? '<div class="gps">GPS recorded \u00b7 \u00b1' + a.accuracy + ' m</div>'
    : '<div class="gps bad">No GPS \u2014 time still recorded</div>';
  el.className = 'arrive on';
  el.innerHTML = '<div><div class="at">Arrived ' + clockTime(a.at) + '</div>' +
                 '<div class="sub2">' + mins + ' min on site</div>' + gps + '</div>';
}
function defaultDay(){ const d = new Date().getDay(); return (d>=1&&d<=5) ? DAYS[d-1] : 'Mon'; }

function loadPrices(){
  const cached = readStore('apt.prices');
  if (cached) { try { state.prices = JSON.parse(cached); } catch(e){} }
  api('getPrices', {})
    .then(d => { state.prices = d.items || []; writeStore('apt.prices', JSON.stringify(state.prices)); })
    .catch(()=>{ /* offline: cached prices still work; server reprices anyway */ });
}

function render(){
  $('hdr').textContent = state.tech ? state.tech + ' · ' + state.day : '';
  if (state.stop) return renderForm();
  let h = '<div class="pickers">' +
    '<select id="tech"><option value="">Who are you?</option>' +
      TECHS.map(t=>`<option ${t===state.tech?'selected':''}>${t}</option>`).join('') + '</select>' +
    '<select id="day">' + DAYS.map(d=>`<option ${d===state.day?'selected':''}>${d}</option>`).join('') + '</select></div>';
  if (!state.tech) { h += '<div class="spinner">Pick your name to see your route.</div>'; }
  else if (!state.route.length) { h += '<div class="spinner">Loading route…</div>'; }
  else {
    h += state.route.map(s => `
      <div class="stop" onclick="openStop(${s.order})">
        <div class="num">${s.order}</div>
        <div><div class="who">${esc(s.customer)}</div><div class="addr">${esc(s.address)}</div></div>
        ${s.status==='Pending'||s.status==='Approved' ? '<div class="done">DONE</div>'
          : s.status==='Skipped' ? '<div class="skip">SKIPPED</div>'
          : `<a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Navigate</a>`}
      </div>`).join('');
  }
  $('app').innerHTML = h;
  $('tech').onchange = e => { state.tech = e.target.value; writeStore('apt.tech', state.tech); loadRoute(); };
  $('day').onchange = e => { state.day = e.target.value; loadRoute(); };
}

function loadRoute(){
  state.route = []; render();
  if (!state.tech) return;
  api('getRoute', { tech: state.tech, day: state.day })
    .then(r => { state.route = r; render(); })
    .catch(e => toast(e.message));
}

function openStop(order){
  state.stop = state.route.find(s => s.order === order);
  state.photos = [];
  // Opening the screen is not arriving. The clock starts when the tech taps
  // "I'm here"; if they never do, submit falls back to the time the stop was
  // opened so a visit is never left without a time at all.
  state.timeIn = new Date().toISOString();
  state.arrival = null;
  if (state.timer){ clearInterval(state.timer); state.timer = null; }
  render();
}

function chemRow(p){
  return `<div class="chem" data-key="${p.key}" data-price="${p.price}">
    <div class="cl"><b>${esc(p.label)}</b><span>${p.price ? money(p.price)+' / '+esc(p.unit) : 'per '+esc(p.unit)+' — price not set'}</span></div>
    <div class="qtybox">
      <button type="button" onclick="bump(this,-1)">−</button>
      <input class="qty" inputmode="decimal" value="" placeholder="0" oninput="recalc()">
      <button type="button" onclick="bump(this,1)">+</button>
    </div>
    <div class="lineamt">–</div>
  </div>`;
}

function renderForm(){
  const s = state.stop;
  const common = [], more = [];
  state.prices.forEach(p => (COMMON_CHEMS.includes(p.key) ? common : more).push(p));
  common.sort((a,b)=>COMMON_CHEMS.indexOf(a.key)-COMMON_CHEMS.indexOf(b.key));
  $('app').innerHTML = `
    <button class="btn back" onclick="state.stop=null;render()">&larr; Route</button>
    <div class="card">
      <h2>${s.order}. ${esc(s.customer)}</h2><div class="addr">${esc(s.address)}</div>
      <div id="arriveBar"></div>

      <div class="svc">${SERVICES.map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('')}</div>

      <div class="sect">Water tests</div>
      <div class="grid4">
        ${READING_FIELDS.map(([k,l])=>`<div class="field"><label>${l}</label><input id="r_${k}" inputmode="decimal"></div>`).join('')}
      </div>

      <div class="sect">Chemicals added</div>
      ${state.prices.length ? '' : '<div class="spinner">Loading price list…</div>'}
      <div id="chemsCommon">${common.map(chemRow).join('')}</div>
      ${more.length ? `<button type="button" class="morechems" onclick="this.style.display='none';$('chemsMore').style.display='block'">More chemicals (${more.length}) ▾</button>
      <div id="chemsMore" style="display:none">${more.map(chemRow).join('')}</div>` : ''}
      <label class="custchem"><input type="checkbox" id="custChems" onchange="recalc()">Customer's own chemicals — don't bill</label>
      <div class="totalbar"><span>Chemicals<small id="chemNote">billed to customer on approval</small></span><span id="chemTotal">$0.00</span></div>

      <div class="sect">Wrap up</div>
      <div class="field"><label>Note to customer (goes in their email)</label><textarea id="custnote"></textarea></div>
      <div class="field"><label>Internal note (office only)</label><textarea id="intnote"></textarea></div>
      <div class="field"><label>Repairs / parts needed (office only)</label><textarea id="repairs"></textarea></div>
      <div class="field"><label>Photos</label>
        <input type="file" id="photos" accept="image/*" multiple capture="environment">
        <div class="thumbs" id="thumbs"></div></div>
      <button class="btn primary" id="submit" onclick="submitVisit(false)">Complete visit</button>
      <button class="btn ghost" onclick="submitVisit(true)">Unable to service…</button>
    </div>`;
  $('photos').onchange = handlePhotos;
  renderArrival();
}

function bump(btn, d){
  const input = btn.parentElement.querySelector('.qty');
  const v = Math.max(0, (parseFloat(input.value)||0) + d);
  input.value = v || '';
  recalc();
}

function recalc(){
  let total = 0;
  document.querySelectorAll('.chem').forEach(row => {
    const qty = parseFloat(row.querySelector('.qty').value)||0;
    const line = qty * (parseFloat(row.dataset.price)||0);
    total += line;
    const el = row.querySelector('.lineamt');
    el.textContent = qty ? money(line) : '–';
    el.classList.toggle('nz', !!qty);
  });
  const cust = $('custChems') && $('custChems').checked;
  $('chemTotal').textContent = cust ? '$0.00' : money(total);
  $('chemNote').textContent = cust ? "customer's own chems — no charge" : 'billed to customer on approval';
}


async function handlePhotos(e){
  state.photos = [];
  $('thumbs').innerHTML = '';
  for (const f of e.target.files){
    const dataUrl = await compress(f, 1600, .8);
    state.photos.push({ name: f.name, mimeType: 'image/jpeg', dataBase64: dataUrl.split(',')[1] });
    const img = document.createElement('img'); img.src = dataUrl; $('thumbs').appendChild(img);
  }
}

function compress(file, maxDim, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.src = URL.createObjectURL(file);
  });
}

function submitVisit(skipped){
  let skipReason = '';
  if (skipped){
    skipReason = prompt("Why couldn't this pool be serviced? (gate locked, dog, etc.)") || '';
    if (!skipReason) return;
  }
  const services = [...document.querySelectorAll('.svc input:checked')].map(x=>x.value);
  if (!skipped && !services.length){ toast('Check at least one service.'); return; }

  const chems = {};
  document.querySelectorAll('.chem').forEach(row => {
    const qty = parseFloat(row.querySelector('.qty').value)||0;
    if (qty > 0) chems[row.dataset.key] = qty;
  });
  const readings = {};
  READING_FIELDS.forEach(([k]) => { const v = $('r_'+k).value; if (v !== '') readings[k] = v; });

  const departedAt = new Date().toISOString();
  const workOrder = {
    timeIn: (state.arrival && state.arrival.at) || state.timeIn,
    timeOut: departedAt,
    arrival: state.arrival,          // {at, lat, lng, accuracy} or null if not tapped
    departedAt: departedAt,
    readings: readings,
    chems: chems,
    repairs: $('repairs').value,
    custChems: !!($('custChems') && $('custChems').checked)
  };

  $('submit').disabled = true; $('submit').textContent = 'Sending…';
  api('submitVisit', { payload: {
      tech: state.tech, day: state.day,
      customer: state.stop.customer, address: state.stop.address,
      services: services,
      workOrder: workOrder,
      noteToCustomer: $('custnote').value,
      internalNote: $('intnote').value,
      skipped: skipped, skipReason: skipReason,
      photos: state.photos
    }})
    .then(() => { toast(skipped ? 'Logged as skipped' : 'Visit sent to office ✓'); state.stop = null; loadRoute(); })
    .catch(e => { toast(e.message); $('submit').disabled=false; $('submit').textContent='Complete visit'; });
}

/* ---------------- OFFICE VIEW ---------------- */
let pin = readStore('apt.pin');
let addRendered = false;   // the add-customer card is drawn once per session
let placement = null;      // last suggestPlacement result
let chosenSlot = 0;        // which suggestion is selected

function askPin(){
  $('addwrap').innerHTML = ''; addRendered = false;
  $('app').innerHTML = '<div class="card"><p>Office PIN:</p><input id="pin" type="password" autocomplete="off" style="padding:10px;border:1px solid var(--line);border-radius:8px">' +
    ' <button class="btn primary" id="pinbtn" style="width:auto;padding:10px 18px">Open</button></div>';
  $('pinbtn').onclick = function(){ pin = $('pin').value; writeStore('apt.pin', pin); loadOffice(); };
  $('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pinbtn').click(); });
  $('pin').focus();
}

function loadOffice(){
  if (!pin) return askPin();
  $('app').innerHTML = '<div class="empty">Loading…</div>';
  api('officeState', { pin: pin })
    .then(renderOffice)
    .catch(e => { if(/PIN/.test(e.message)){ pin=''; writeStore('apt.pin',''); askPin(); toast('Wrong PIN'); } else $('app').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}

function officeBill(v){
  if (v.status === 'Skipped') return '';
  const wo = v.workOrder || {};
  const total = (v.rate||0) + (v.chemCharge||0);
  return `<div class="bill">
    <span>Rate ${money(v.rate)} + Chems ${money(v.chemCharge)}${wo.custChems ? ' <i>(cust. chems)</i>' : ''}</span>
    <b>= ${money(total)}</b>
    ${!v.rate ? '<span class="warn">⚠ no Rate set in Customers tab</span>' : ''}
  </div>`;
}

function officeWorkOrder(v){
  const wo = v.workOrder;
  if (!wo) return '';
  let h = '';
  if (wo.timeIn && wo.timeOut){
    const mins = Math.max(0, Math.round((new Date(wo.timeOut)-new Date(wo.timeIn))/60000));
    const a = wo.arrival;
    const stamped = a && a.at ? 'arrived' : 'opened the stop at';
    h += `<div class="kv"><b>On site:</b> ${clockTime(wo.timeIn)} \u2192 ${clockTime(wo.timeOut)} (${mins} min)` +
         (a && a.at ? '' : ' <span class="warn">\u2014 tech never tapped "I\u2019m here", so this is when they ' + stamped + ' the screen</span>') +
         `</div>`;
  }
  const a = wo.arrival;
  if (a && a.lat != null){
    const near = (v.gpsFt == null) ? ''
      : (v.gpsFt <= 500 ? ` \u2014 <b>${v.gpsFt} ft from the address \u2713</b>`
                        : ` \u2014 <span class="warn">${v.gpsFt} ft from the address</span>`);
    h += `<div class="kv"><b>GPS:</b> <a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" rel="noopener">${a.lat}, ${a.lng}</a> \u00b1${a.accuracy} m${near}</div>`;
  } else if (a) {
    h += `<div class="kv"><b>GPS:</b> <span class="warn">not captured</span></div>`;
  }
  if (wo.repairs) h += `<div class="kv"><b>Repairs/parts:</b> ${esc(wo.repairs)}</div>`;
  return h;
}

function renderOffice(st){
  // Drawn once and then left alone — a Refresh or an approval must not wipe a
  // half-typed customer.
  if (!addRendered) { renderAdd(); renderCustomersCard(); addRendered = true; }
  let h = '<div class="card qb"><span class="dot ' + (st.qbConnected?'on':'') + '"></span>' +
    (st.qbConnected ? 'QuickBooks connected'
      : (st.qbAuthUrl ? 'QuickBooks not connected — <a href="'+st.qbAuthUrl+'" target="_blank" rel="noopener">Connect QuickBooks</a> (reload after)'
          : 'QuickBooks not configured — set QB_CLIENT_ID / QB_CLIENT_SECRET in Script Properties')) +
    '</div>';
  if (!st.pending.length) h += '<div class="empty">No visits waiting. ✓</div>';
  st.pending.forEach((v,i) => {
    h += `<div class="card" id="v${i}">
      <h2 style="font-size:1.05rem">${esc(v.customer)} <span class="badge">${esc(v.status)}</span></h2>
      <div class="meta">${esc(v.when)} · ${esc(v.tech)} · ${esc(v.address)}</div>
      ${v.services ? `<div class="kv"><b>Services:</b> ${esc(v.services)}</div>` : ''}
      ${v.readings ? `<div class="kv"><b>Readings:</b> ${esc(v.readings)}</div>` : ''}
      ${v.chemicals ? `<div class="kv"><b>Chemicals:</b> ${esc(v.chemicals)}</div>` : ''}
      ${officeWorkOrder(v)}
      ${v.noteToCustomer ? `<div class="kv"><b>Note to customer:</b> ${esc(v.noteToCustomer)}</div>` : ''}
      ${v.internalNote ? `<div class="kv"><b>Internal:</b> ${esc(v.internalNote)}</div>` : ''}
      ${v.photos.length ? `<div class="kv"><b>Photos:</b> ${v.photos.map((p,j)=>`<a href="${p}" target="_blank" rel="noopener">photo ${j+1}</a>`).join(' ')}</div>` : ''}
      ${officeBill(v)}
      ${v.error ? `<div class="err">Last error: ${esc(v.error)}</div>` : ''}
      <div class="actions">
        <button class="primary" onclick="approve('${v.visitId}',${i},true,true)">Approve — invoice + email</button>
        <button onclick="approve('${v.visitId}',${i},false,true)">Email only</button>
        <button onclick="approve('${v.visitId}',${i},false,false)">Approve only</button>
        <button class="danger" onclick="rejectVisit('${v.visitId}')">Reject</button>
      </div>
      <div class="err" id="e${i}"></div>
    </div>`;
  });
  h += '<button class="btn back" onclick="loadOffice()">Refresh</button>';
  $('app').innerHTML = h;
}

function approve(id, i, invoice, email){
  [...document.querySelectorAll(`#v${i} button`)].forEach(b=>b.disabled=true);
  api('approve', { pin: pin, visitId: id, options: { invoice: invoice, email: email } })
    .then(r => {
      let msg = 'Approved.';
      if (r.invoiceId) msg += ' Invoice #' + r.invoiceId + ' created.';
      if (r.emailed) msg += ' Email sent.';
      (r.warnings||[]).forEach(w => msg += ' ⚠ ' + w);
      alert(msg); loadOffice();
    })
    .catch(e => { $('e'+i).textContent = e.message; [...document.querySelectorAll(`#v${i} button`)].forEach(b=>b.disabled=false); });
}

function rejectVisit(id){
  const reason = prompt('Reason for rejecting this visit?') || '';
  api('reject', { pin: pin, visitId: id, reason: reason })
    .then(loadOffice).catch(e=>alert(e.message));
}

/* ---------------- ADD A CUSTOMER ---------------- */

function renderAdd(){
  $('addwrap').innerHTML = `
    <div class="card">
      <div class="addhead">
        <h2>Add a customer</h2>
        <button id="ac_toggle">Open</button>
      </div>
      <div id="ac_body" hidden>
        <div class="field" style="margin-top:12px">
          <label>Name <span class="hint">— last, first, the way it should read on the invoice</span></label>
          <input id="ac_name" placeholder="Bishop, Lacey">
        </div>
        <div class="field">
          <label>Service address</label>
          <input id="ac_addr" placeholder="845 Billy Bryant Rd, Collierville, TN 38017">
        </div>
        <div class="f2">
          <div class="field"><label>Email <span class="hint">— for confirmations</span></label><input id="ac_email" type="email" inputmode="email"></div>
          <div class="field"><label>Phone</label><input id="ac_phone" inputmode="tel"></div>
        </div>
        <div class="f2">
          <div class="field"><label>Rate <span class="hint">— per visit, numbers only</span></label><input id="ac_rate" inputmode="decimal" placeholder="85"></div>
          <div class="field"><label>QuickBooks id <span class="hint">— only if the QBO name differs</span></label><input id="ac_qbid"></div>
        </div>
        <button class="btn primary" id="ac_find">Find the best spot</button>
        <div class="err" id="ac_err"></div>
        <div id="ac_result"></div>
      </div>
    </div>`;

  $('ac_toggle').onclick = function(){
    const body = $('ac_body');
    body.hidden = !body.hidden;
    this.textContent = body.hidden ? 'Open' : 'Close';
    if (!body.hidden) $('ac_name').focus();
  };
  $('ac_find').onclick = () => findSpot();
}

async function findSpot(manualLat, manualLng){
  const addr = $('ac_addr').value.trim();
  $('ac_err').textContent = '';
  if (!$('ac_name').value.trim()) { $('ac_err').textContent = 'Enter the customer name first.'; return; }
  if (!addr) { $('ac_err').textContent = 'Enter the service address first.'; return; }

  const btn = $('ac_find');
  btn.disabled = true; btn.textContent = 'Looking…';
  try {
    placement = await api('suggestPlacement', {
      pin: pin, address: addr, lat: manualLat || '', lng: manualLng || ''
    });
    chosenSlot = 0;
    renderSlots();
  } catch (e) {
    placement = null;
    $('ac_err').textContent = e.message;
    renderManualCoords();   // geocoder struck out — let them paste coordinates
  } finally {
    btn.disabled = false; btn.textContent = 'Find the best spot';
  }
}

/** "between X and Y" / "new first stop" / "opens an empty day". */
function slotWhere(s){
  if (s.newDay) return 'opens ' + s.tech + '’s empty ' + s.day;
  if (!s.afterCustomer) return 'new first stop, ahead of ' + s.beforeCustomer;
  if (!s.beforeCustomer) return 'new last stop, after ' + s.afterCustomer;
  return 'between ' + s.afterCustomer + ' and ' + s.beforeCustomer;
}

function renderSlots(){
  const p = placement;
  let h = `<div class="matched"><b>Matched:</b> ${esc(p.formattedAddress)}` +
    (p.manual ? ' <span class="warn">(your coordinates)</span>' : '') +
    (p.approximate ? '<div class="warn">⚠ Only an approximate match — check this is the right house before adding.</div>' : '') +
    (p.matchCount > 1 ? `<div class="note">${p.matchCount} addresses matched; using the closest.</div>` : '') +
    '</div>';

  if (!p.suggestions.length) { h += '<div class="err">No route to add this to.</div>'; $('ac_result').innerHTML = h; return; }

  h += p.suggestions.map((s, i) => `
    <label class="slot ${i===chosenSlot?'on':''}">
      <input type="radio" name="ac_slot" value="${i}" ${i===chosenSlot?'checked':''}>
      <div>
        <div class="who">${esc(s.tech)} · ${esc(s.day)} · stop ${s.position}</div>
        <div class="why">${esc(slotWhere(s))}${s.newDay ? '' : ` · that day has ${s.load} stops`}</div>
        ${s.penaltyMi > 0 ? `<div class="why warn">Already at ${s.load} stops — heavy day.</div>` : ''}
      </div>
      <div class="mi">+${s.detourMi} mi</div>
    </label>`).join('');

  h += `<button class="btn primary" id="ac_save">Add to ${esc(p.suggestions[chosenSlot].tech)}’s ${esc(p.suggestions[chosenSlot].day)}</button>
    <div class="note">Added miles are straight-line, between stops — the same measure the route plan uses. Driving order is renumbered automatically.</div>
    <div class="err" id="ac_saveerr"></div>`;

  $('ac_result').innerHTML = h;
  [...document.querySelectorAll('input[name=ac_slot]')].forEach(r => {
    r.onchange = () => { chosenSlot = Number(r.value); renderSlots(); };
  });
  $('ac_save').onclick = saveCustomer;
}

/** Fallback when the geocoder can't place the address. */
function renderManualCoords(){
  $('ac_result').innerHTML = `
    <div class="matched">
      <div>Type the coordinates instead: open Google Maps, press and hold (or
      right-click) the house, then tap the numbers to copy them.</div>
      <div class="f2" style="margin-top:10px">
        <div class="field"><label>Latitude</label><input id="ac_lat" inputmode="decimal" placeholder="35.0421"></div>
        <div class="field"><label>Longitude</label><input id="ac_lng" inputmode="decimal" placeholder="-89.6712"></div>
      </div>
      <button class="btn primary" id="ac_manual">Use these coordinates</button>
    </div>`;
  $('ac_manual').onclick = function(){
    const lat = $('ac_lat').value.trim(), lng = $('ac_lng').value.trim();
    if (!lat || !lng) { $('ac_err').textContent = 'Both numbers are needed.'; return; }
    findSpot(lat, lng);
  };
}

async function saveCustomer(){
  const s = placement.suggestions[chosenSlot];
  const btn = $('ac_save');
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const r = await api('addCustomer', { pin: pin, payload: {
      customer: $('ac_name').value.trim(),
      address: $('ac_addr').value.trim(),
      lat: placement.lat, lng: placement.lng,
      tech: s.tech, day: s.day, newOrder: s.newOrder,
      email: $('ac_email').value.trim(),
      phone: $('ac_phone').value.trim(),
      rate: $('ac_rate').value.trim(),
      qbCustomerId: $('ac_qbid').value.trim()
    }});
    let msg = 'Added to ' + r.tech + '’s ' + r.day + ' route as stop ' + r.order + '.';
    (r.warnings || []).forEach(w => msg += '\n\n⚠ ' + w);
    alert(msg);
    ['ac_name','ac_addr','ac_email','ac_phone','ac_rate','ac_qbid']
      .forEach(id => { $(id).value = ''; });
    $('ac_result').innerHTML = ''; placement = null; chosenSlot = 0;
    toast('Customer added');
    loadOffice();
  } catch (e) {
    $('ac_saveerr').textContent = e.message;
    btn.disabled = false; btn.textContent = 'Add customer';
  }
}

/* ---------------- CUSTOMERS ---------------- */

let cust = { list: null, orphans: [], q: '', open: null, loading: false };

function custKey(c){ return c.customer + '|' + c.address; }

function renderCustomersCard(){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="addhead">
      <h2>Customers</h2>
      <button id="cu_toggle">Open</button>
    </div>
    <div id="cu_body" hidden>
      <input class="cu-search" id="cu_q" placeholder="Search by name or address" autocomplete="off">
      <div class="cu-count" id="cu_count"></div>
      <div id="cu_list"></div>
      <div id="cu_orph"></div>
    </div>`;
  $('addwrap').appendChild(card);

  $('cu_toggle').onclick = function(){
    const body = $('cu_body');
    body.hidden = !body.hidden;
    this.textContent = body.hidden ? 'Open' : 'Close';
    if (!body.hidden) { if (!cust.list) loadCustomers(); else $('cu_q').focus(); }
  };
  $('cu_q').oninput = e => { cust.q = e.target.value; cust.open = null; renderCustList(); };
}

async function loadCustomers(){
  cust.loading = true;
  $('cu_count').textContent = 'Loading…';
  try {
    const r = await api('listCustomers', { pin: pin });
    cust.list = r.customers; cust.orphans = r.orphans || [];
    renderCustList();
    $('cu_q').focus();
  } catch (e) {
    $('cu_count').innerHTML = '<span class="err">' + esc(e.message) + '</span>';
  } finally { cust.loading = false; }
}

function custMatches(c, q){
  if (!q) return true;
  const hay = (c.customer + ' ' + c.address).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderCustList(){
  if (!cust.list) return;
  const q = cust.q.trim();
  const all = cust.list.filter(c => custMatches(c, q));
  const active = all.filter(c => c.days.length);
  const inactive = all.filter(c => !c.days.length);
  const CAP = 60;
  const shown = active.slice(0, CAP);

  $('cu_count').textContent =
    `${active.length} on routes` + (inactive.length ? ` · ${inactive.length} inactive` : '') +
    (active.length > CAP ? ` · showing the first ${CAP} — narrow the search` : '');

  const row = (c, i, isInactive) => {
    const key = custKey(c);
    const opened = cust.open === key;
    return `
    <div class="cu ${isInactive ? 'inactive' : ''}" data-key="${esc(key)}">
      <div class="cu-head" data-act="toggle">
        <div>
          <div class="nm">${esc(c.customer)}</div>
          <div class="ad">${esc(c.address)}</div>
          <div class="cu-days">${
            c.days.length
              ? c.days.map(d => `<span class="chip">${esc(d.tech)} ${esc(d.day)} · #${d.order}</span>`).join('')
              : '<span class="chip">not on a route</span>'}
            ${c.openVisits ? `<span class="cu-flag">${c.openVisits} awaiting approval</span>` : ''}
            ${!c.email && c.days.length ? '<span class="cu-flag">no email</span>' : ''}
          </div>
        </div>
        <div class="rt ${c.rate == null ? 'none' : ''}">${c.rate == null ? 'no rate' : '$' + c.rate}</div>
      </div>
      ${opened ? `
      <div class="cu-body">
        <div class="f2">
          <div class="field"><label>Email</label><input data-f="email" value="${esc(c.email)}" inputmode="email"></div>
          <div class="field"><label>Phone</label><input data-f="phone" value="${esc(c.phone)}" inputmode="tel"></div>
        </div>
        <div class="f2">
          <div class="field"><label>Rate <span class="hint">— per visit</span></label><input data-f="rate" value="${c.rate == null ? '' : c.rate}" inputmode="decimal"></div>
          <div class="field"><label>QuickBooks id</label><input data-f="qbCustomerId" value="${esc(c.qbCustomerId)}"></div>
        </div>
        <div class="actions">
          <button class="primary" data-act="save">Save</button>
          ${c.days.length ? `<button class="danger" data-act="remove" ${c.openVisits ? 'disabled' : ''}>Remove from routes</button>` : ''}
        </div>
        ${c.openVisits ? `<div class="note">Can't remove while ${c.openVisits} visit${c.openVisits > 1 ? 's are' : ' is'} waiting for approval — clear the queue first.</div>` : ''}
        ${!c.days.length ? `<div class="actions" style="margin-top:0"><button class="primary" data-act="readd">Add back to routes</button></div>
        <div class="note">Fills in <b>Add a customer</b> from their record, so the name and address match exactly. Then pick a slot as usual — they'll be placed against the routes as they stand now.</div>` : ''}
        <div class="err" data-err></div>
      </div>` : ''}
    </div>`;
  };

  let h = shown.map((c, i) => row(c, i, false)).join('');
  if (inactive.length) h += inactive.map((c, i) => row(c, i, true)).join('');
  if (!all.length) h = '<div class="empty">No customers match.</div>';
  $('cu_list').innerHTML = h;

  $('cu_orph').innerHTML = cust.orphans.length ? `
    <div class="cu-orph"><b>${cust.orphans.length} route stop${cust.orphans.length > 1 ? 's have' : ' has'} no customer record</b> —
      they'll invoice at $0 and email nobody. Add each through <b>Add a customer</b> with the exact same name and address to fix:
      <ul style="margin:6px 0 0 18px;padding:0">${cust.orphans.map(o =>
        `<li>${esc(o.customer)} — ${esc(o.address)} <span class="ad">(${o.days.map(d => d.tech + ' ' + d.day).join(', ')})</span></li>`).join('')}</ul>
    </div>` : '';

  [...document.querySelectorAll('#cu_list .cu')].forEach(el => {
    const key = el.dataset.key;
    el.querySelector('[data-act=toggle]').onclick = () => { cust.open = cust.open === key ? null : key; renderCustList(); };
    const save = el.querySelector('[data-act=save]');
    if (save) save.onclick = () => cuSave(el, key);
    const rm = el.querySelector('[data-act=remove]');
    if (rm) rm.onclick = () => cuRemove(el, key);
    const re = el.querySelector('[data-act=readd]');
    if (re) re.onclick = () => cuReadd(key);
  });
}

/** Pre-fill the add form from a stored record so re-adding never retypes the address. */
function cuReadd(key){
  const c = cust.list.find(x => custKey(x) === key);
  $('ac_name').value = c.customer;
  $('ac_addr').value = c.address;
  $('ac_email').value = c.email;
  $('ac_phone').value = c.phone;
  $('ac_rate').value = c.rate == null ? '' : c.rate;
  $('ac_qbid').value = c.qbCustomerId;
  $('ac_result').innerHTML = ''; placement = null;
  if ($('ac_body').hidden) $('ac_toggle').click();
  $('ac_body').scrollIntoView({ behavior: 'smooth', block: 'start' });
  toast('Form filled — now Find the best spot');
}

async function cuSave(el, key){
  const c = cust.list.find(x => custKey(x) === key);
  const fields = {};
  el.querySelectorAll('[data-f]').forEach(i => { fields[i.dataset.f] = i.value.trim(); });
  const btn = el.querySelector('[data-act=save]');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('updateCustomer', { pin: pin, customer: c.customer, address: c.address, fields: fields });
    Object.assign(c, { email: fields.email, phone: fields.phone, qbCustomerId: fields.qbCustomerId,
                       rate: fields.rate === '' ? null : Number(fields.rate) });
    toast('Saved');
    renderCustList();
  } catch (e) {
    el.querySelector('[data-err]').textContent = e.message;
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function cuRemove(el, key){
  const c = cust.list.find(x => custKey(x) === key);
  const days = c.days.map(d => d.tech + ' ' + d.day).join(' and ');
  if (!confirm(`Remove ${c.customer} from ${days}?\n\nTheir visit history and photos are kept. To bring them back later, use Add a customer.`)) return;
  const btn = el.querySelector('[data-act=remove]');
  btn.disabled = true; btn.textContent = 'Removing…';
  try {
    const r = await api('removeCustomer', { pin: pin, customer: c.customer, address: c.address });
    c.days = []; c.active = false; cust.open = null;
    toast(`Removed from ${r.days.join(', ')}`);
    renderCustList();
  } catch (e) {
    el.querySelector('[data-err]').textContent = e.message;
    btn.disabled = false; btn.textContent = 'Remove from routes';
  }
}

/* ---------------- BOOT ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (IS_OFFICE) {
  $('title').textContent = 'APT Office';
  loadOffice();
} else {
  render();
  loadPrices();
  if (state.tech) loadRoute();
